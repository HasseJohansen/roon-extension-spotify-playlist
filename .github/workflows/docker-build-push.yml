name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Determine version and update package.json
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG=${{ github.event.release.tag_name }}
            VERSION=${TAG#v}
          else
            # push to main → mark the current package.json version as a test build
            VERSION="$(node -p "require('./package.json').version")-test"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${VERSION}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Build and push (main branch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: hassejohansen/roon-extension-spotify-playlist:latest

      - name: Build and push (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            hassejohansen/roon-extension-spotify-playlist:${{ github.event.release.tag_name }}
            hassejohansen/roon-extension-spotify-playlist:latest
